<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Editor storia · Night Run</title>
<!-- Strumento personale, fuori dal gioco: legge i dati delle chat, li mostra come mappa a bivi e permette di riscrivere i testi.
     Le modifiche si salvano da sole nel browser; "Copia modifiche" produce il file da mandare a Claude (node strumenti/assorbi_modifiche.mjs).
     Si apre dal PC: doppio clic sul file, oppure da http://localhost:8765/strumenti/editor_storia.html -->
<style>
:root{--bg:#0e1014;--p:#171a21;--p2:#1e222b;--l:#2a303c;--t:#e6e8ee;--m:#8b93a5;--a:#f5a524;--ok:#4ade80;--r:#f87171;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--t);font:14px/1.45 system-ui,Segoe UI,sans-serif}
button{font:inherit;color:var(--t);background:var(--p2);border:1px solid var(--l);border-radius:7px;padding:6px 11px;cursor:pointer}
button:hover{border-color:var(--m)}button.pri{background:var(--a);color:#1a1200;border-color:var(--a);font-weight:600}
input,textarea{font:inherit;color:var(--t);background:#0b0d11;border:1px solid var(--l);border-radius:7px;padding:7px 9px;width:100%}
textarea{resize:vertical;line-height:1.5}textarea:focus,input:focus{outline:2px solid var(--a);outline-offset:-1px}
#app{display:grid;grid-template-rows:auto auto 1fr;height:100%}
header{display:flex;gap:10px;align-items:center;padding:9px 14px;background:var(--p);border-bottom:1px solid var(--l);flex-wrap:wrap}
header h1{font-size:15px;margin:0 8px 0 0}header .sp{flex:1}
#cnt{color:var(--m)}#cnt b{color:var(--a)}
#tl{background:var(--p);border-bottom:1px solid var(--l);padding:6px 14px 8px}
#tlin{position:relative;height:138px;margin-left:78px}
.fb{position:absolute;top:0;bottom:14px}.fb span{position:absolute;bottom:-14px;left:4px;font-size:10px;color:var(--m);letter-spacing:.08em}
.cp{position:absolute;top:0;bottom:14px;border-left:1px solid #3a4152}.cp b{position:absolute;top:-1px;left:3px;font-size:10px;font-weight:500;color:#aab1c2;white-space:nowrap}
.ln{position:absolute;left:-78px;font-size:11px;width:72px;text-align:right}
.pt{position:absolute;width:10px;height:10px;margin:-5px 0 0 -5px;border-radius:50%;cursor:pointer;border:0;padding:0}
.pt:hover{transform:scale(1.6)}.pt.sel{outline:2px solid #fff;outline-offset:2px;transform:scale(1.5);z-index:3}.pt.mod{box-shadow:0 0 0 2px var(--a)}
#tlnow{font-size:12px;color:var(--m);margin:2px 0 0 78px;min-height:18px}#tlnow b{color:var(--t)}
.cap{margin:12px 0 4px;padding:3px 8px;border-radius:6px;background:#232838;color:#c9cfdd;font-size:11px;letter-spacing:.04em}
.cond{display:block;font-size:11px;color:var(--m);line-height:1.3}
main{display:grid;grid-template-columns:270px 1fr 440px;min-height:0}
aside,section{min-height:0;overflow:auto}
#side{background:var(--p);border-right:1px solid var(--l);padding:10px}
#ed{background:var(--p);border-left:1px solid var(--l);padding:14px}
.tabs{display:flex;gap:6px;margin:8px 0}.tabs button{flex:1}.tabs .on{border-color:var(--a);color:var(--a)}
.chips{display:flex;flex-wrap:wrap;gap:5px;margin:8px 0}.chip{padding:2px 9px;border-radius:99px;font-size:12px;border:1px solid var(--l);cursor:pointer;color:var(--m)}
.chip.on{color:#111;border-color:transparent}
.grp{margin:12px 0 4px;color:var(--m);font-size:11px;text-transform:uppercase;letter-spacing:.08em}
.conv{padding:6px 8px;border-radius:7px;cursor:pointer;display:flex;gap:6px;align-items:center;font-size:13px}
.conv:hover{background:var(--p2)}.conv.sel{background:var(--p2);outline:1px solid var(--a)}
.conv small{color:var(--m);margin-left:auto}.dot{width:8px;height:8px;border-radius:50%;background:var(--a);flex:none}
#map{position:relative;padding:18px;overflow:auto;background:radial-gradient(#1b1f28 1px,transparent 1px) 0 0/22px 22px}
#inner{position:relative;display:inline-flex;gap:80px;align-items:flex-start;min-width:100%}
.col{display:flex;flex-direction:column;gap:16px;width:250px}
#edges{position:absolute;left:0;top:0;pointer-events:none;overflow:visible}
.card{background:var(--p);border:1px solid var(--l);border-radius:10px;padding:8px 9px;cursor:pointer;border-left:4px solid var(--c,#555)}
.card:hover{border-color:var(--m)}.card.sel{outline:2px solid var(--a)}.card.mod{background:#241d0d;border-color:#6b4d10}
.card h4{margin:0 0 4px;font:11px ui-monospace,Consolas,monospace;color:var(--m);display:flex;gap:6px;align-items:center}
.card h4 .f{margin-left:auto;background:var(--p2);padding:0 6px;border-radius:5px}
.card .tx{display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden;font-size:13px}
.opt{margin-top:6px;padding:4px 7px;border-radius:6px;background:var(--p2);font-size:12px;border:1px solid transparent;display:flex;gap:6px}
.opt span{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;flex:1}
.opt a{color:var(--a);white-space:nowrap;text-decoration:none;font-size:11px}
.opt.end{opacity:.6}.tag{font-size:10px;color:var(--m);margin-top:5px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}.two>div>label,.lab{display:block;font-size:11px;color:var(--m);margin-bottom:3px;text-transform:uppercase;letter-spacing:.06em}
.orig{background:#0b0d11;border:1px dashed var(--l);border-radius:7px;padding:7px 9px;white-space:pre-wrap;color:#b5bbc9;min-height:40px}
.blk{margin:14px 0;padding-top:12px;border-top:1px solid var(--l)}
.meta{font-size:12px;color:var(--m);display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}.meta span{background:var(--p2);padding:1px 8px;border-radius:99px}
.meta .w{color:var(--a)}
.fx{font:11px ui-monospace,Consolas,monospace;color:var(--m);margin-top:4px;word-break:break-all}
#toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--ok);color:#052e16;padding:8px 16px;border-radius:9px;font-weight:600;display:none;z-index:9}
#modal{position:fixed;inset:0;background:#000b;display:none;align-items:center;justify-content:center;z-index:8}
#modal div{background:var(--p);border:1px solid var(--l);border-radius:12px;padding:16px;width:min(700px,92vw)}
#modal textarea{height:300px;font:12px ui-monospace,Consolas,monospace}
.vuoto{color:var(--m);padding:30px;text-align:center}
@media(max-width:1100px){main{grid-template-columns:230px 1fr}#ed{grid-column:1/3;border-left:0;border-top:1px solid var(--l)}}
</style>
</head>
<body>
<div id="app">
<header>
  <h1>Editor storia</h1><span id="cnt"></span><span class="sp"></span>
  <button id="bCarica" title="Riapre un file di modifiche scaricato prima">Carica modifiche…</button>
  <button id="bAzzera">Azzera bozza</button>
  <button id="bScarica">Scarica file</button>
  <button id="bCopia" class="pri">Copia modifiche</button>
  <input id="fileIn" type="file" accept=".json,application/json" hidden>
</header>
<div id="tl"><div id="tlin"></div><div id="tlnow"></div></div>
<main>
  <aside id="side">
    <input id="q" placeholder="Cerca un ID o una frase…">
    <div class="chips" id="chPers"></div>
    <div class="chips" id="chFase"></div>
    <div class="tabs"><button id="tSeq" class="on">Sequenza</button><button id="tConv">Per persona</button><button id="tMod">Modificate</button></div>
    <div id="list"></div>
  </aside>
  <section id="map"><div id="inner"><svg id="edges"></svg></div></section>
  <aside id="ed"><div class="vuoto">Scegli una conversazione a sinistra, poi un riquadro nella mappa.</div></aside>
</main>
</div>
<div id="toast"></div>
<div id="modal"><div><p style="margin-top:0">Il browser non ha lasciato copiare da solo: seleziona tutto e copia a mano.</p><textarea id="mt" readonly></textarea><p style="text-align:right;margin-bottom:0"><button id="mx">Chiudi</button></p></div></div>

<script src="../chat_dati.js"></script>
<script src="../chat_modifiche.js"></script>
<script>
'use strict';
// CHAT_LIST qui è già "com'è nel gioco adesso" (chat_dati.js + ritocchi di chat_modifiche.js): è la colonna ORIGINALE.
const COL = { Elena: '#e879a6', Rosa: '#f59e0b', Livia: '#38bdf8', Sconosciuto: '#ef4444', Dario: '#34d399' };
const FASI = ['I', 'II', 'III', 'IV', 'V'];
const KEY = 'nr_editor_storia';
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const lines = (t) => (Array.isArray(t) ? t : [t == null ? '' : t]);
const norm = (raw) => String(raw).split('\n').map((x) => x.trim()).filter(Boolean);
const NODES = {}; CHAT_LIST.forEach((n) => (NODES[n.id] = n));
const groupOf = (id) => id.replace(/_\d+$/, '');
const GROUPS = {};
CHAT_LIST.forEach((n) => { const g = groupOf(n.id); (GROUPS[g] || (GROUPS[g] = { id: g, who: n.who, nodes: [] })).nodes.push(n); });
const STARTS = {}; (typeof CHAT_START !== 'undefined' ? CHAT_START : []).forEach((s) => (STARTS[s.node] = s));
const UNL = {}; Object.entries(typeof CHAT_UNLOCK !== 'undefined' ? CHAT_UNLOCK : {}).forEach(([who, o]) => Object.entries(o).forEach(([sg, ids]) => ids.forEach((i) => (UNL[i] = `${who} · confidenza ${sg}`))));

// ---- la sequenza nel gioco. Capitali: km di arrivo dal giro di VG_ROUTE (viaggio.js); fasi da STORIA_FASE (storia.js).
const ROUTE = [['tokyo', 12], ['wangan', 30], ['roma', 12], ['sangimignano', 30], ['parigi', 12], ['bassa', 30], ['londra', 12], ['hakone', 30], ['stoccolma', 12], ['bassa', 30], ['berlino', 12], ['sangimignano', 30], ['praga', 12], ['hakone', 30], ['vienna', 12], ['positano', 30], ['madrid', 12], ['positano', 30], ['lisbona', 12], ['sangimignano', 30], ['atene', 12], ['route66', 30], ['washington', 12], ['route66', 30]];
const FASE_CAP = { tokyo: 'I', roma: 'I', parigi: 'II', londra: 'III', stoccolma: 'III', berlino: 'III', praga: 'III', vienna: 'III', madrid: 'IV', lisbona: 'IV', atene: 'V', washington: 'V' };
const BEAT_CAP = { ev_distanza_impossibile: 'parigi', ev_indizio_sangue: 'stoccolma', ev_foto_originale: 'praga', ev_imitazione_dario: 'lisbona', ev_presenza_scoperta: 'madrid', ev_fase_v: 'atene' };
const NOME = (id) => id.charAt(0).toUpperCase() + id.slice(1);
const CAPKM = {}; let _k = 0; ROUTE.forEach(([id, l]) => { if (FASE_CAP[id] && CAPKM[id] == null) CAPKM[id] = _k; _k += l; });
const LANES = ['Elena', 'Rosa', 'Livia', 'Sconosciuto', 'Dario'], MAXKM = 690;
const reqs = (r) => (r ? (Array.isArray(r) ? r : [r]) : []);
function effKm(st) {
  for (const r of reqs(st.req)) { let m;
    if ((m = /^flag:luogo_(\w+)$/.exec(r)) && CAPKM[m[1]] != null) return { km: CAPKM[m[1]] + 1, how: `appena arrivi a ${NOME(m[1])}` };
    if ((m = /^flag:(ev_\w+)$/.exec(r)) && BEAT_CAP[m[1]]) return { km: CAPKM[BEAT_CAP[m[1]]] + 8, how: `dopo l'evento di ${NOME(BEAT_CAP[m[1]])}` }; }
  return { km: st.km, how: '' };
}
const condTxt = (r) => reqs(r).map((x) => x.replace(/^fatto:/, 'dopo ').replace(/^flag:/, 'se ').replace(/^!flag:/, 'se NON ')).join(' · ');
const TL = []; // ingressi in ordine: { km, group, node, who, how, cond }
(typeof CHAT_START !== 'undefined' ? CHAT_START : []).forEach((st, i) => { if (!NODES[st.node]) return; const e = effKm(st); TL.push({ km: e.km, i, group: groupOf(st.node), node: st.node, who: st.th, how: e.how, cond: condTxt(st.req) }); });
TL.sort((a, b) => a.km - b.km || a.i - b.i);
const PLACED = new Set(TL.map((t) => t.group));
const CONF = []; Object.entries(typeof CHAT_UNLOCK !== 'undefined' ? CHAT_UNLOCK : {}).forEach(([who, o]) => Object.entries(o).forEach(([sg, ids]) => ids.forEach((id) => { if (NODES[id] && !PLACED.has(groupOf(id))) { CONF.push({ who, sg: +sg, group: groupOf(id), node: id }); } })));
const CONFG = new Set(CONF.map((c) => c.group));
const ALTRE = Object.keys(GROUPS).filter((g) => !PLACED.has(g) && !CONFG.has(g));

let S = { draft: {}, group: null, node: null, tab: 'seq', pers: null, fase: null, q: '' };
try { S.draft = JSON.parse(localStorage.getItem(KEY) || '{}'); } catch (e) {}
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(S.draft)); } catch (e) {} };

// ---- bozza: per ogni nodo solo i campi che differiscono dall'originale
function eff(n) { const d = S.draft[n.id] || {}; return { text: d.text != null ? d.text : lines(n.text).join('\n'), alt: (n.alt || []).map((a, i) => (d.alt && d.alt[i] != null ? d.alt[i] : a.text)), opts: (n.opts || []).map((o, i) => (d.opts && d.opts[i] != null ? d.opts[i] : o.t)) }; }
function setField(n, kind, i, val) {
  const d = (S.draft[n.id] = S.draft[n.id] || {});
  let orig, same;
  if (kind === 'text') { orig = lines(n.text); same = norm(val).join('\n') === orig.join('\n'); if (same) delete d.text; else d.text = val; }
  else { orig = kind === 'alt' ? n.alt[i].text : n.opts[i].t; same = val.trim() === String(orig).trim(); d[kind] = d[kind] || {}; if (same) delete d[kind][i]; else d[kind][i] = val; if (!Object.keys(d[kind]).length) delete d[kind]; }
  if (!Object.keys(d).length) delete S.draft[n.id];
  save();
}
const isMod = (id) => !!S.draft[id];
function exportMod() {
  const out = {};
  for (const id of Object.keys(S.draft)) {
    const n = NODES[id]; if (!n) continue; const d = S.draft[id], o = {};
    if (d.text != null) { const l = norm(d.text); if (l.length) o.text = l.length === 1 ? l[0] : l; }
    for (const k of ['alt', 'opts']) if (d[k]) { o[k] = {}; for (const i of Object.keys(d[k])) { const v = d[k][i].trim(); if (v) o[k][i] = v; } if (!Object.keys(o[k]).length) delete o[k]; }
    if (Object.keys(o).length) out[id] = o;
  }
  return out;
}
const exportJson = () => JSON.stringify({ formato: 'nightrun-mod-1', data: new Date().toISOString().slice(0, 10), mod: exportMod() }, null, 1);

// ---- barra e liste
function refreshCount() { const k = Object.keys(exportMod()).length; $('#cnt').innerHTML = `${CHAT_LIST.length} nodi · <b>${k}</b> modificat${k === 1 ? 'o' : 'i'}`; }
function chips() {
  const who = [...new Set(CHAT_LIST.map((n) => n.who))];
  $('#chPers').innerHTML = who.map((w) => `<span class="chip ${S.pers === w ? 'on' : ''}" data-p="${esc(w)}" style="${S.pers === w ? 'background:' + (COL[w] || '#999') : ''}">${esc(w)}</span>`).join('');
  $('#chFase').innerHTML = FASI.map((f) => `<span class="chip ${S.fase === f ? 'on' : ''}" data-f="${f}" style="${S.fase === f ? 'background:#cbd5e1' : ''}">fase ${f}</span>`).join('');
}
function matches(g) {
  if (S.pers && g.who !== S.pers) return false;
  if (S.fase && !g.nodes.some((n) => n.fase === S.fase)) return false;
  const q = S.q.trim().toLowerCase(); if (!q) return true;
  return g.id.toLowerCase().includes(q) || g.nodes.some((n) => { const e = eff(n); return n.id.toLowerCase().includes(q) || e.text.toLowerCase().includes(q) || e.opts.some((t) => t.toLowerCase().includes(q)); });
}
function renderList() {
  let h = '';
  if (S.tab === 'seq') {
    const vis = TL.filter((t) => matches(GROUPS[t.group])); let lastCap = null; const caps = Object.entries(CAPKM).sort((a, b) => a[1] - b[1]);
    vis.forEach((t) => {
      let c = null; caps.forEach(([id, km]) => { if (km <= t.km) c = id; });
      if (c !== lastCap) { lastCap = c; h += `<div class="cap">${c ? `da ${NOME(c)} · km ${CAPKM[c]} · fase ${FASE_CAP[c]}` : 'prima di Tokyo'}</div>`; }
      h += `<div class="conv ${S.group === t.group ? 'sel' : ''}" data-g="${esc(t.group)}" data-n="${esc(t.node)}"><i class="dot" style="background:${COL[t.who] || '#999'}"></i><span>${esc(t.group)}<span class="cond">km ${Math.round(t.km)}${t.how ? ' · ' + esc(t.how) : ''}${t.cond ? ' · ' + esc(t.cond) : ''}</span></span>${GROUPS[t.group].nodes.some((n) => isMod(n.id)) ? '<small style="color:var(--a)">●</small>' : ''}</div>`;
    });
    const sez = (tit, list) => { const l = list.filter((x) => matches(GROUPS[x.group])); if (!l.length) return ''; return `<div class="cap">${tit} · ${l.length}</div>` + l.map((x) => `<div class="conv ${S.group === x.group ? 'sel' : ''}" data-g="${esc(x.group)}" data-n="${esc(x.node || '')}"><i class="dot" style="background:${COL[x.who || GROUPS[x.group].who] || '#999'}"></i><span>${esc(x.group)}${x.sg ? `<span class="cond">${esc(x.who)} · confidenza ${x.sg}</span>` : ''}</span></div>`).join(''); };
    h += sez('Si aprono con la confidenza (senza km)', CONF.sort((a, b) => a.sg - b.sg));
    h += sez('Partono da altre scelte o dalla regia', ALTRE.map((g) => ({ group: g, node: GROUPS[g].nodes[0].id })));
    if (!h) h = '<div class="vuoto">Nessun risultato.</div>';
  } else if (S.tab === 'mod') {
    const ids = Object.keys(exportMod());
    h = ids.length ? ids.map((id) => `<div class="conv ${S.node === id ? 'sel' : ''}" data-n="${esc(id)}"><span class="dot"></span>${esc(id)}</div>`).join('') : '<div class="vuoto">Ancora niente.</div>';
  } else {
    const by = {}; Object.values(GROUPS).filter(matches).forEach((g) => (by[g.who] = by[g.who] || []).push(g));
    for (const w of Object.keys(by)) {
      h += `<div class="grp" style="color:${COL[w] || ''}">${esc(w)} · ${by[w].length}</div>`;
      h += by[w].map((g) => `<div class="conv ${S.group === g.id ? 'sel' : ''}" data-g="${esc(g.id)}">${g.nodes.some((n) => isMod(n.id)) ? '<span class="dot"></span>' : ''}${esc(g.id)}<small>${g.nodes.length}</small></div>`).join('');
    }
    if (!h) h = '<div class="vuoto">Nessun risultato.</div>';
  }
  $('#list').innerHTML = h;
}

// ---- mappa
function renderMap() {
  const inner = $('#inner'); const svg = $('#edges');
  inner.querySelectorAll('.col').forEach((c) => c.remove());
  const g = GROUPS[S.group]; if (!g) { svg.setAttribute('width', 0); return; }
  const ids = new Set(g.nodes.map((n) => n.id)), inc = {};
  g.nodes.forEach((n) => (n.opts || []).forEach((o) => { if (ids.has(o.to)) inc[o.to] = 1; }));
  const roots = g.nodes.filter((n) => !inc[n.id]); const dep = {}, order = [];
  const q = (roots.length ? roots : [g.nodes[0]]).map((n) => { dep[n.id] = 0; return n.id; });
  while (q.length) { const id = q.shift(); order.push(id); (NODES[id].opts || []).forEach((o) => { if (ids.has(o.to) && dep[o.to] == null) { dep[o.to] = dep[id] + 1; q.push(o.to); } }); }
  g.nodes.forEach((n) => { if (dep[n.id] == null) { dep[n.id] = 0; order.push(n.id); } });
  const cols = []; order.forEach((id) => (cols[dep[id]] = cols[dep[id]] || []).push(id));
  const col = COL[g.who] || '#888';
  cols.forEach((list) => {
    const c = document.createElement('div'); c.className = 'col';
    c.innerHTML = (list || []).map((id) => {
      const n = NODES[id], e = eff(n), st = STARTS[id], note = [st ? `parte km ${st.km}` : '', UNL[id] || '', n.req ? 'condizione' : '', (n.alt || []).length ? `${n.alt.length} variant${n.alt.length > 1 ? 'i' : 'e'}` : ''].filter(Boolean).join(' · ');
      const opts = (n.opts || []).length ? n.opts.map((o, i) => { const out = !ids.has(o.to); return `<div class="opt" data-to="${esc(o.to)}" data-in="${out ? 0 : 1}"><span>${esc(e.opts[i])}</span>${out ? `<a href="#" data-go="${esc(o.to)}">${esc(o.to)} ↗</a>` : ''}</div>`; }).join('') : '<div class="opt end"><span>fine della chat</span></div>';
      return `<div class="card ${isMod(id) ? 'mod' : ''} ${S.node === id ? 'sel' : ''}" data-id="${esc(id)}" style="--c:${col}"><h4>${esc(id.slice(g.id.length + 1) || id)}${n.as ? ` <span>(come ${esc(n.as)})</span>` : ''}<span class="f">${n.fase}</span></h4><div class="tx">${esc(e.text.split('\n').join(' ¶ '))}</div>${opts}${note ? `<div class="tag">${esc(note)}</div>` : ''}</div>`;
    }).join('');
    inner.appendChild(c);
  });
  requestAnimationFrame(drawEdges);
}
function drawEdges() {
  const inner = $('#inner'), svg = $('#edges'), r0 = inner.getBoundingClientRect();
  svg.setAttribute('width', inner.scrollWidth); svg.setAttribute('height', inner.scrollHeight);
  let p = '';
  inner.querySelectorAll('.opt[data-in="1"]').forEach((o) => {
    const from = o.closest('.card'), to = inner.querySelector(`.card[data-id="${CSS.escape(o.dataset.to)}"]`); if (!to) return;
    const a = o.getBoundingClientRect(), b = to.getBoundingClientRect();
    const x1 = a.right - r0.left, y1 = a.top + a.height / 2 - r0.top, x2 = b.left - r0.left, y2 = b.top + 18 - r0.top;
    const on = from.dataset.id === S.node || to.dataset.id === S.node, back = x2 <= x1 + 4;
    const k = back ? 70 : Math.max(40, (x2 - x1) / 2);
    p += `<path d="M${x1},${y1} C${x1 + k},${y1} ${x2 - k},${y2} ${x2},${y2}" fill="none" stroke="${on ? '#f5a524' : '#4b5365'}" stroke-width="${on ? 2.2 : 1.3}" ${back ? 'stroke-dasharray="5 4"' : ''} opacity="${on ? 1 : .8}"/><circle cx="${x2}" cy="${y2}" r="3" fill="${on ? '#f5a524' : '#4b5365'}"/>`;
  });
  svg.innerHTML = p;
}

// ---- pannello di modifica
function two(label, orig, kind, i, val, rows) {
  return `<div class="two"><div><label>${label} · originale</label><div class="orig">${esc(orig)}</div></div><div><label>Come lo vorrei</label><textarea rows="${rows}" data-k="${kind}" data-i="${i}">${esc(val)}</textarea></div></div>`;
}
function renderEd() {
  const n = NODES[S.node], el = $('#ed');
  if (!n) { el.innerHTML = '<div class="vuoto">Scegli un riquadro nella mappa.</div>'; return; }
  const e = eff(n), st = STARTS[n.id];
  const req = (r) => (Array.isArray(r) ? r.join(' + ') : r);
  let h = `<div style="display:flex;gap:8px;align-items:center"><b style="font:14px ui-monospace,monospace">${esc(n.id)}</b><span style="flex:1"></span><button id="bRip" ${isMod(n.id) ? '' : 'disabled'}>Ripristina nodo</button></div>`;
  h += `<div class="meta"><span class="w">${esc(n.who)}</span>${n.as ? `<span>chat di ${esc(n.as)}</span>` : ''}<span>fase ${n.fase}</span>${st ? `<span>parte al km ${st.km}</span>` : ''}${UNL[n.id] ? `<span>${esc(UNL[n.id])}</span>` : ''}${n.req ? `<span>solo se ${esc(req(n.req))}</span>` : ''}${n.fallback ? `<span>altrimenti → ${esc(n.fallback)}</span>` : ''}</div>`;
  h += `<div class="blk" style="border:0;padding:0;margin-top:10px">${two('Testo (una riga = un messaggio)', lines(n.text).join('\n'), 'text', 0, e.text, Math.max(4, e.text.split('\n').length + 1))}</div>`;
  (n.alt || []).forEach((a, i) => { h += `<div class="blk"><div class="lab">Variante ${i + 1} · solo se <b style="color:var(--a)">${esc(req(a.req))}</b></div>${two('Testo', a.text, 'alt', i, e.alt[i], 3)}</div>`; });
  (n.opts || []).forEach((o, i) => {
    const out = !GROUPS[S.group].nodes.some((x) => x.id === o.to);
    h += `<div class="blk"><div class="lab">Risposta ${i + 1} · tono ${esc(o.tono || '—')} → <a href="#" data-go="${esc(o.to)}" style="color:var(--a)">${esc(o.to)}</a>${o.req ? ` · solo se ${esc(req(o.req))}` : ''}</div>${two('Risposta', o.t, 'opts', i, e.opts[i], 2)}${(o.fx || []).length ? `<div class="fx">effetti: ${esc(o.fx.join('  '))}</div>` : ''}</div>`;
  });
  h += `<div class="fx" style="margin-top:14px">Qui cambi solo le parole. Bivi, condizioni ed effetti (confidenza, flag) restano com'è: se vuoi cambiare anche quelli, scrivilo a Claude.</div>`;
  el.innerHTML = h;
}

// ---- azioni
function pickGroup(id, node) { S.group = id; S.node = node || GROUPS[id].nodes[0].id; renderAll(); }
function pickNode(id) { S.node = id; const g = groupOf(id); if (S.group !== g) { S.group = g; renderAll(); } else { document.querySelectorAll('.card').forEach((c) => c.classList.toggle('sel', c.dataset.id === id)); renderEd(); drawEdges(); renderList(); renderTl(); } }
function renderTl() {
  const box = $('#tlin'); if (!box) return; const pc = (km) => (Math.min(km, MAXKM) / MAXKM * 100).toFixed(2) + '%';
  const faseKm = {}; Object.entries(CAPKM).forEach(([id, km]) => { const f = FASE_CAP[id]; if (faseKm[f] == null || km < faseKm[f]) faseKm[f] = km; });
  let h = '';
  FASI.forEach((f, i) => { const a = faseKm[f] || 0, b = faseKm[FASI[i + 1]] != null ? faseKm[FASI[i + 1]] : MAXKM; h += `<div class="fb" style="left:${pc(a)};width:${((b - a) / MAXKM * 100).toFixed(2)}%;background:${i % 2 ? '#ffffff08' : '#ffffff12'}"><span>FASE ${f}</span></div>`; });
  Object.entries(CAPKM).forEach(([id, km]) => { h += `<div class="cp" style="left:${pc(km)}"><b>${NOME(id)}</b></div>`; });
  LANES.forEach((w, i) => { h += `<div class="ln" style="top:${22 + i * 20 - 6}px;color:${COL[w]}">${w}</div>`; });
  const seen = {};
  TL.forEach((t) => { const lane = LANES.indexOf(t.who); if (lane < 0) return; const key = lane + ':' + Math.round(t.km); const j = seen[key] = (seen[key] || 0) + 1; const g = GROUPS[t.group];
    h += `<button class="pt ${S.group === t.group ? 'sel' : ''} ${g.nodes.some((n) => isMod(n.id)) ? 'mod' : ''}" data-g="${esc(t.group)}" data-n="${esc(t.node)}" title="${esc(t.group)} · km ${Math.round(t.km)}${t.how ? ' · ' + esc(t.how) : ''}" style="left:calc(${pc(t.km)} + ${(j - 1) * 8}px);top:${22 + lane * 20}px;background:${COL[t.who]}"></button>`; });
  box.innerHTML = h;
  const cur = TL.find((t) => t.group === S.group);
  $('#tlnow').innerHTML = !S.group ? '' : cur ? `Adesso: <b>${esc(cur.group)}</b> · ${esc(cur.who)} · km ${Math.round(cur.km)} · fase ${esc(NODES[cur.node].fase)}${cur.how ? ' · ' + esc(cur.how) : ''}${cur.cond ? ' · ' + esc(cur.cond) : ''} <span style="color:var(--m)">(i km sono indicativi)</span>` : `Adesso: <b>${esc(S.group)}</b> · non ha un km: ${CONFG.has(S.group) ? 'si apre con la confidenza' : 'parte da altre scelte o dalla regia'}`;
}
function renderAll() { chips(); renderList(); renderMap(); renderEd(); refreshCount(); renderTl(); }
function toast(t) { const x = $('#toast'); x.textContent = t; x.style.display = 'block'; clearTimeout(toast.t); toast.t = setTimeout(() => (x.style.display = 'none'), 2200); }
async function copia() {
  const k = Object.keys(exportMod()).length; if (!k) return toast('Non hai modificato niente');
  const j = exportJson();
  try { await navigator.clipboard.writeText(j); toast(`Copiato: ${k} nodi. Incollalo a Claude o scarica il file.`); }
  catch (e) { $('#mt').value = j; $('#modal').style.display = 'flex'; $('#mt').select(); }
}
function scarica() {
  const k = Object.keys(exportMod()).length; if (!k) return toast('Non hai modificato niente');
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([exportJson()], { type: 'application/json' }));
  a.download = 'modifiche_storia.json'; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 2000); toast('File scaricato');
}
function carica(file) {
  const r = new FileReader();
  r.onload = () => {
    try {
      const j = JSON.parse(r.result), mod = j.mod || j; let k = 0;
      for (const id of Object.keys(mod)) { const n = NODES[id]; if (!n) continue; const m = mod[id];
        if (m.text != null) setField(n, 'text', 0, lines(m.text).join('\n'));
        for (const kk of ['alt', 'opts']) for (const i of Object.keys(m[kk] || {})) if (n[kk] && n[kk][i]) setField(n, kk, i, m[kk][i]);
        k++; }
      renderAll(); toast(`Caricati ${k} nodi`);
    } catch (e) { toast('File non valido'); }
  };
  r.readAsText(file);
}

document.addEventListener('click', (ev) => {
  const t = ev.target;
  const go = t.closest('[data-go]'); if (go) { ev.preventDefault(); if (NODES[go.dataset.go]) pickNode(go.dataset.go); return; }
  const pt = t.closest('.pt'); if (pt) { pickGroup(pt.dataset.g, pt.dataset.n); return; }
  const cv = t.closest('.conv'); if (cv) { if (cv.dataset.g) pickGroup(cv.dataset.g, cv.dataset.n || null); else if (cv.dataset.n) pickNode(cv.dataset.n); return; }
  const cd = t.closest('.card'); if (cd) { pickNode(cd.dataset.id); return; }
  const cp = t.closest('[data-p]'); if (cp) { S.pers = S.pers === cp.dataset.p ? null : cp.dataset.p; chips(); renderList(); return; }
  const cf = t.closest('[data-f]'); if (cf) { S.fase = S.fase === cf.dataset.f ? null : cf.dataset.f; chips(); renderList(); return; }
});
$('#q').addEventListener('input', (e) => { S.q = e.target.value; renderList(); });
const tabBtn = { seq: '#tSeq', conv: '#tConv', mod: '#tMod' };
Object.entries(tabBtn).forEach(([k, id]) => { $(id).onclick = () => { S.tab = k; Object.values(tabBtn).forEach((x) => $(x).classList.toggle('on', x === id)); renderList(); }; });
$('#ed').addEventListener('input', (ev) => {
  const ta = ev.target.closest('textarea'); if (!ta) return;
  setField(NODES[S.node], ta.dataset.k, ta.dataset.i, ta.value);
  const c = document.querySelector(`.card[data-id="${CSS.escape(S.node)}"]`), e = eff(NODES[S.node]);
  if (c) { c.classList.toggle('mod', isMod(S.node)); c.querySelector('.tx').textContent = e.text.split('\n').join(' ¶ '); c.querySelectorAll('.opt').forEach((o, i) => { const s = o.querySelector('span'); if (e.opts[i] != null) s.textContent = e.opts[i]; }); }
  $('#bRip').disabled = !isMod(S.node); refreshCount(); drawEdges(); renderTl();
});
$('#ed').addEventListener('click', (ev) => { if (ev.target.id === 'bRip') { delete S.draft[S.node]; save(); renderAll(); } });
$('#bCopia').onclick = copia; $('#bScarica').onclick = scarica;
$('#bCarica').onclick = () => $('#fileIn').click(); $('#fileIn').onchange = (e) => { if (e.target.files[0]) carica(e.target.files[0]); e.target.value = ''; };
$('#bAzzera').onclick = () => { if (Object.keys(S.draft).length && confirm('Cancello tutte le modifiche non ancora assorbite da Claude?')) { S.draft = {}; save(); renderAll(); } };
$('#mx').onclick = () => ($('#modal').style.display = 'none');
addEventListener('resize', drawEdges);
$('#map').addEventListener('scroll', () => {});
const primo = Object.values(GROUPS).find((g) => g.who === 'Elena') || Object.values(GROUPS)[0];
pickGroup(primo.id);
</script>
</body>
